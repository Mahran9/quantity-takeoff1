<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Navy Blueprint Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#111e38"/>
      <stop offset="100%" stop-color="#091122"/>
    </linearGradient>

    <!-- Warm Gold / Amber Engineering Accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Cyan Blueprint Line Accent -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Subtle CAD Grid Pattern -->
    <pattern id="cadGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#38bdf8" stroke-opacity="0.09" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.2" fill="#38bdf8" fill-opacity="0.16"/>
    </pattern>

    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Full-bleed background (Adaptive Icon Safe) -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  <rect width="512" height="512" fill="url(#cadGrid)"/>

  <!-- Subtle outer engineering border frame -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#f59e0b" stroke-opacity="0.22" stroke-width="2.5"/>

  <!-- Blueprint Sheet Card -->
  <g filter="url(#dropShadow)">
    <rect x="96" y="88" width="276" height="332" rx="26" fill="#172544" stroke="url(#cyanGrad)" stroke-width="4"/>

    <!-- Structural Column & Footing CAD Plan inside Blueprint -->
    <rect x="124" y="118" width="220" height="148" rx="12" fill="#0c162c" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2"/>
    <!-- Grid axes -->
    <line x1="164" y1="118" x2="164" y2="266" stroke="#38bdf8" stroke-opacity="0.25" stroke-dasharray="5 5" stroke-width="1.5"/>
    <line x1="304" y1="118" x2="304" y2="266" stroke="#38bdf8" stroke-opacity="0.25" stroke-dasharray="5 5" stroke-width="1.5"/>
    <line x1="124" y1="158" x2="344" y2="158" stroke="#38bdf8" stroke-opacity="0.25" stroke-dasharray="5 5" stroke-width="1.5"/>
    <line x1="124" y1="228" x2="344" y2="228" stroke="#38bdf8" stroke-opacity="0.25" stroke-dasharray="5 5" stroke-width="1.5"/>

    <!-- Footings + Columns -->
    <rect x="148" y="142" width="32" height="32" rx="4" fill="#f59e0b" fill-opacity="0.22" stroke="#fbbf24" stroke-width="2.5"/>
    <rect x="158" y="152" width="12" height="12" fill="#fbbf24"/>

    <rect x="288" y="142" width="32" height="32" rx="4" fill="#f59e0b" fill-opacity="0.22" stroke="#fbbf24" stroke-width="2.5"/>
    <rect x="298" y="152" width="12" height="12" fill="#fbbf24"/>

    <rect x="148" y="212" width="32" height="32" rx="4" fill="#f59e0b" fill-opacity="0.22" stroke="#fbbf24" stroke-width="2.5"/>
    <rect x="158" y="222" width="12" height="12" fill="#fbbf24"/>

    <rect x="288" y="212" width="32" height="32" rx="4" fill="#f59e0b" fill-opacity="0.22" stroke="#fbbf24" stroke-width="2.5"/>
    <rect x="298" y="222" width="12" height="12" fill="#fbbf24"/>

    <!-- Tie Beams (Mida) -->
    <line x1="180" y1="158" x2="288" y2="158" stroke="#38bdf8" stroke-width="3.5"/>
    <line x1="180" y1="228" x2="288" y2="228" stroke="#38bdf8" stroke-width="3.5"/>
    <line x1="164" y1="174" x2="164" y2="212" stroke="#38bdf8" stroke-width="3.5"/>
    <line x1="304" y1="174" x2="304" y2="212" stroke="#38bdf8" stroke-width="3.5"/>

    <!-- BOQ Table Rows below plan -->
    <rect x="124" y="284" width="220" height="22" rx="6" fill="#f59e0b" fill-opacity="0.2"/>
    <rect x="134" y="291" width="108" height="8" rx="4" fill="#fbbf24"/>
    <rect x="276" y="291" width="56" height="8" rx="4" fill="#38bdf8"/>

    <rect x="124" y="318" width="220" height="22" rx="6" fill="#0c162c"/>
    <rect x="134" y="325" width="124" height="8" rx="4" fill="#94a3b8"/>
    <rect x="276" y="325" width="56" height="8" rx="4" fill="#34d399"/>

    <rect x="124" y="352" width="220" height="22" rx="6" fill="#0c162c"/>
    <rect x="134" y="359" width="96" height="8" rx="4" fill="#94a3b8"/>
    <rect x="276" y="359" width="56" height="8" rx="4" fill="#34d399"/>
  </g>

  <!-- Golden Engineering Ruler & Verified Check Badge (Bottom Right) -->
  <g filter="url(#dropShadow)">
    <!-- Triangular Engineering Scale Ruler -->
    <polygon points="318,424 432,424 432,310" fill="url(#goldGrad)" stroke="#fef3c7" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="366,404 412,404 412,358" fill="#0f172a"/>
    <!-- Ruler tick marks -->
    <line x1="342" y1="424" x2="342" y2="413" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="364" y1="424" x2="364" y2="411" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="386" y1="424" x2="386" y2="413" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="408" y1="424" x2="408" y2="411" stroke="#0f172a" stroke-width="2.5"/>
  </g>
</svg>
